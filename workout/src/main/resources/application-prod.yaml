spring:
  application:
    name: workout

  datasource:
    driver-class-name: org.postgresql.Driver
    username: root
    password: password
    url: jdbc:postgresql://localhost:5433/workout_db

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true

  management:
    endpoints:
      web:
        exposure:
          include: health, info, prometheus

  config:
    import: "optional:consul:"

  cloud:
    consul:
      host: localhost
      port: 8500

server:
  port: 8081